name: Question of the day

# Push for the question of the day (src/features/prompts), same pattern as retention.yml: the
# work happens in the app, authorized with the CRON_SECRET repo secret (= CRON_SECRET in
# shared/.env.production). The question itself rotates in the database (pg_cron, 19:00 MYT);
# this job rotates too (idempotent) and sends the push once. 200 with active=false while the
# migration is not applied or the queue is empty.
on:
  schedule:
    # 19:05 Malaysia time (11:05 UTC), five minutes after the pg_cron rotation.
    - cron: '5 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-prompt
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: POST /api/cron/daily-prompt
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Repository secret CRON_SECRET is not set"
            exit 1
          fi
          status=$(curl -sS -o body.txt -w '%{http_code}' --max-time 280 -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" "https://vibelydate.com/api/cron/daily-prompt") || status=000
          echo "HTTP $status $(head -c 300 body.txt 2>/dev/null)"
          [ "$status" = "200" ]
