name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once on the same server.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:sql
      - run: npm run test:unit

  # Builds in CI (the 1 GB droplet never compiles), ships a standalone release, switches
  # /var/www/vibely/current atomically and rolls back if /api/health fails.
  #
  # Repository secrets: VPS_HOST, VPS_USER (deploy), VPS_SSH_KEY, VPS_KNOWN_HOSTS.
  # Repository variables (public values, inlined into the client bundle at build time):
  #   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, NEXT_PUBLIC_SITE_URL
  #   optional: NEXT_PUBLIC_VAPID_PUBLIC_KEY, NEXT_PUBLIC_TURNSTILE_SITE_KEY,
  #             NEXT_PUBLIC_ANALYTICS_SRC, NEXT_PUBLIC_ANALYTICS_SITE_ID
  # Server-only secrets live in /var/www/vibely/shared/.env.production on the VPS.
  deploy:
    needs: check
    runs-on: ubuntu-24.04
    environment: production
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_ANALYTICS_SRC: ${{ vars.NEXT_PUBLIC_ANALYTICS_SRC }}
      NEXT_PUBLIC_ANALYTICS_SITE_ID: ${{ vars.NEXT_PUBLIC_ANALYTICS_SITE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build
        # Version skew protection: a browser still running an older build gets a full reload
        # instead of "Failed to find Server Action" (e.g. an installed PWA after a deploy).
        env:
          NEXT_DEPLOYMENT_ID: ${{ github.sha }}
        run: npm run build
      - name: Assemble release
        run: |
          RELEASE="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          scripts/deploy/assemble.sh "release/$RELEASE"
          tar -czf release.tgz -C release "$RELEASE"
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Upload and activate
        env:
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes"
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes release.tgz "$TARGET:/tmp/$RELEASE.tgz"
          $SSH "$TARGET" "set -e
            mkdir -p /var/www/vibely/releases
            tar -xzf /tmp/$RELEASE.tgz -C /var/www/vibely/releases && rm /tmp/$RELEASE.tgz
            /var/www/vibely/releases/$RELEASE/activate.sh $RELEASE"
      - name: Public health check
        run: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors https://vibelydate.com/api/health
