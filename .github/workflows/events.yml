name: Blind Dating Night reminders

# Same pattern as retention.yml / telegram.yml: the work happens in the app, authorized with the
# CRON_SECRET repo secret (= CRON_SECRET in shared/.env.production).
# Every 5 minutes: POST /api/cron/events-push applies the event clock (fallback for the pg_cron
# tick) and sends the "starts in 15 minutes" and "live now" pushes to people who tapped Remind.
# GitHub schedules can run a few minutes late; the database stamps each reminder so nothing is
# sent twice and nothing is sent once the night is 20 minutes old.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: events-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: POST /api/cron/events-push
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Repository secret CRON_SECRET is not set"
            exit 1
          fi
          status=$(curl -sS -o body.txt -w '%{http_code}' --max-time 120 -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" "https://vibelydate.com/api/cron/events-push") || status=000
          echo "HTTP $status $(head -c 300 body.txt 2>/dev/null)"
          [ "$status" = "200" ]
