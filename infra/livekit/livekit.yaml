# LiveKit server for Vibely calls (docs/calls.md). API keys are NOT in this file: they come from
# the LIVEKIT_KEYS environment variable (docker-compose.yml ← .env).
port: 7880
# The host Nginx terminates TLS and proxies https/wss://rtc.vibelydate.com → 127.0.0.1:7880.
bind_addresses:
  - 127.0.0.1
log_level: info

rtc:
  # ICE over TCP when UDP is blocked; media over the UDP range. Both must be open in the firewall.
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  # Discover the droplet's public IP (STUN) and announce it in ICE candidates.
  use_external_ip: true
  enable_loopback_candidate: false

redis:
  address: 127.0.0.1:6379

# Built-in TURN for users behind strict NAT / mobile carriers:
#   TURN/UDP on 443 (often the only UDP port allowed on restrictive networks; Nginx uses TCP 443)
#   TURN/TLS on 5349/tcp, TLS terminated by LiveKit with the Let's Encrypt certificate.
turn:
  enabled: true
  domain: turn.vibelydate.com
  udp_port: 443
  tls_port: 5349
  external_tls: false
  cert_file: /etc/livekit-certs/fullchain.pem
  key_file: /etc/livekit-certs/privkey.pem

room:
  # Rooms are created by the app (one per call, "call_<uuid>"), never on join.
  auto_create: false
  empty_timeout: 60
  departure_timeout: 20
  max_participants: 4
  enabled_codecs:
    - mime: audio/opus
    - mime: video/vp8
    - mime: video/h264

# Call status and recording results go back to the app (POST /api/livekit/webhook), signed with
# this API key's secret. MUST equal LIVEKIT_API_KEY of the app (.env.production on the web VPS).
webhook:
  api_key: vibely-1
  urls:
    - https://vibelydate.com/api/livekit/webhook

# Limits per room. Two people per call: keep bitrate modest for mobile data.
limit:
  num_tracks: 6
  bytes_per_sec: 2_000_000
