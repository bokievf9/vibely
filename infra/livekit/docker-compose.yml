# Vibely media stack, on the same droplet as the web app (see docs/calls.md):
#   livekit  SFU + built-in TURN (TURN/UDP 443, TURN/TLS 5349 with the Let's Encrypt certificate)
#   egress   server-side call recording → S3-compatible bucket
#   redis    shared state between livekit and egress (localhost only)
# HTTPS/WSS for rtc.vibelydate.com is terminated by the host Nginx (it already owns TCP 443) and
# proxied to 127.0.0.1:7880.
#
# Secrets come from ./.env (chmod 600, never committed; template: .env.example).
# All services use the host network: WebRTC needs the real UDP port range and public IP.
# Image tags are pinned: check the release notes before bumping them.

services:
  redis:
    image: redis:7.4-alpine
    network_mode: host
    restart: unless-stopped
    command: >
      redis-server --bind 127.0.0.1 --port 6379 --protected-mode yes
      --save "" --appendonly no
    healthcheck:
      test: ['CMD', 'redis-cli', '-h', '127.0.0.1', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  livekit:
    image: livekit/livekit-server:v1.13.9
    network_mode: host
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    command: --config /etc/livekit.yaml
    environment:
      # "<api key>: <api secret>" (YAML). During a key rotation: "{key1: s1, key2: s2}" (docs/calls.md).
      LIVEKIT_KEYS: ${LIVEKIT_KEYS:?set LIVEKIT_KEYS in .env}
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
      # TURN/TLS certificate (rtc + turn SANs), copied here by the certbot deploy hook.
      - ./certs:/etc/livekit-certs:ro

  egress:
    image: livekit/egress:v1.15.0
    network_mode: host
    restart: unless-stopped
    depends_on:
      - livekit
    # Chrome (room composite) runs sandboxed; the sandbox needs SYS_ADMIN.
    cap_add:
      - SYS_ADMIN
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}
      # Write access to the recordings bucket (Spaces key or Supabase S3 key).
      AWS_ACCESS_KEY_ID: ${RECORDINGS_S3_ACCESS_KEY_ID:?set RECORDINGS_S3_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${RECORDINGS_S3_SECRET_ACCESS_KEY:?set RECORDINGS_S3_SECRET_ACCESS_KEY in .env}
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
    # Chrome needs shared memory for video composites.
    shm_size: 1gb
