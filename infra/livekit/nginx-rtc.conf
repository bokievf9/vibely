# /etc/nginx/sites-available/vibely-rtc (symlinked into sites-enabled). Certbot adds the TLS lines.
# LiveKit signaling (HTTPS + WebSocket) for rtc.vibelydate.com → 127.0.0.1:7880.
# turn.vibelydate.com is listed only so the certificate covers it (TURN/TLS itself runs on 5349).
server {
    server_name rtc.vibelydate.com turn.vibelydate.com;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    listen 80;
}
